name: Atualizar dados e publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 09 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências dos dados
        run: pip install -r scripts/requirements.txt

      - name: Atualizar pesquisas da Wikipédia
        run: python scripts/notebook_pesquisas.py

      - name: Estimar séries e gerar gráficos
        run: python scripts/build_presidential_data.py

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"

      - name: Preparar pnpm
        run: npm install --global pnpm@11.0.0

      - name: Instalar dependências do site
        run: pnpm install --frozen-lockfile

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar aplicação para a exportação estática
        run: cp -R build/app app

      - name: Gerar site estático
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm run build:static

      - name: Materializar arquivos para o GitHub Pages
        run: |
          mkdir -p pages-dist
          cp -RL out/. pages-dist/
          touch pages-dist/.nojekyll
          if [ ! -s pages-dist/index.html ]; then
            index_source=".next/server/app/index.html"
            if [ ! -s "$index_source" ]; then
              index_source="$(find pages-dist -type f -name index.html -size +0c ! -path '*/404/*' ! -path '*/_not-found/*' -print -quit)"
            fi
            test -n "$index_source"
            cp "$index_source" pages-dist/index.html
          fi
          test -s pages-dist/index.html

      - name: Empacotar páginas
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
