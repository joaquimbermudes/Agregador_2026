name: Atualizar dados e publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 09 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências dos dados
        run: pip install -r scripts/requirements.txt

      - name: Atualizar pesquisas da Wikipédia
        run: python scripts/notebook_pesquisas.py

      - name: Estimar séries e gerar gráficos
        run: python scripts/build_presidential_data.py

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Instalar dependências do site
        run: pnpm install --frozen-lockfile

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar site estático
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm run build:static

      - name: Empacotar páginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
